      &lt;p&gt;D76=A：55 个原 taskId 全部保留；完整旧记录只读导入，缺失历史建立不可执行 legacy stub，不伪造任务成功。&lt;/p&gt;

&lt;script&gt;
(() =&gt; {
  const root = document.getElementById(&quot;d7-database-cutover&quot;);
  if (!root) return;

  const currentSurfaces = [
    {
      id: &quot;prisma&quot;,
      name: &quot;Prisma 骨架&quot;,
      status: &quot;未接线&quot;,
      content: &quot;Project、StoryVersion、Shot、Candidate、Asset、GenerationTask 共 6 个模型；没有 migration 目录、数据库文件或业务 CRUD。&quot;,
      risk: &quot;不能在现有表上小修小补；D7 是主事实源迁移。&quot;
    },
    {
      id: &quot;workspace&quot;,
      name: &quot;workspace 元数据&quot;,
      status: &quot;当前权威&quot;,
      content: &quot;项目、章节、剧本、结构、分镜、候选、排版和工作流分散在 JSON/Markdown，并由 ProjectRepository 整树重写。&quot;,
      risk: &quot;跨文件无事务，重复字段与加载优先级会制造状态漂移。&quot;
    },
    {
      id: &quot;assets&quot;,
      name: &quot;素材字节&quot;,
      status: &quot;应保留&quot;,
      content: &quot;当前样例 64 个 WebP、约 54 MB；67 条 Asset 记录均找到文件，候选与角色引用完整。&quot;,
      risk: &quot;素材不应塞入 SQLite，但必须由 Asset、摘要和状态约束。&quot;
    },
    {
      id: &quot;runtime&quot;,
      name: &quot;内存运行态&quot;,
      status: &quot;会丢失&quot;,
      content: &quot;任务、对话线程、消息、工具结果、灵感/大纲/结构待确认状态和 Promise 队列都依赖 Map/Set。&quot;,
      risk: &quot;服务重启会丢任务与对话；55 个旧 taskId 中 54 个没有完整 artifact。&quot;
    },
    {
      id: &quot;settings&quot;,
      name: &quot;设置与密钥&quot;,
      status: &quot;需分层&quot;,
      content: &quot;非秘密偏好与 provider 配置可入数据库；API Key 当前在 gitignored settings JSON。&quot;,
      risk: &quot;明文秘密不能因为“全量数据库化”就进入普通业务表。&quot;
    }
  ];

  const targets = [
    {
      id: &quot;database&quot;,
      name: &quot;关系数据库&quot;,
      status: &quot;唯一业务事实源&quot;,
      content: &quot;项目、章节、版本、角色、镜头、候选、修订、任务、对话、画布、导出和所有 current 指针。&quot;,
      rule: &quot;当前推荐关系核心 + 版本化 Json + 可重建投影；所有业务写入只走数据库。&quot;
    },
    {
      id: &quot;filestore&quot;,
      name: &quot;受控文件存储&quot;,
      status: &quot;只存大字节&quot;,
      content: &quot;图片、音视频、PDF、ZIP 和交付副本继续放 workspace，数据库保存 storageKey、sha256、bytes 和来源。&quot;,
      rule: &quot;文件写入使用 staged → rename → ready，并有孤儿/缺失恢复。&quot;
    },
    {
      id: &quot;secret&quot;,
      name: &quot;密钥存储&quot;,
      status: &quot;普通 DB 之外&quot;,
      content: &quot;文本 key 归 OpenCode 本地 auth；图片 key 归后端 SecretStore，数据库只保存引用、fingerprint 与配置状态。&quot;,
      rule: &quot;图片 key 不进入前端、日志、任务、普通备份或业务数据库；OpenCode auth 可正常保存文本 key。&quot;
    },
    {
      id: &quot;memory&quot;,
      name: &quot;可重建内存&quot;,
      status: &quot;非权威&quot;,
      content: &quot;活动 SSE、短锁、视图缓存、worker 唤醒信号与当前 AbortController 可以留在内存。&quot;,
      rule: &quot;任务队列、attempt、lease 和取消请求必须在数据库；重启后可重新发现。&quot;
    }
  ];

  const stages = [
    { id: &quot;M0&quot;, name: &quot;契约与 migration&quot;, content: &quot;设计目标 schema、显式外键动作、首份 migration history 与 PrismaService。&quot;, gate: &quot;闸门：migration 可在空库重复部署，schema 与契约一致。&quot; },
    { id: &quot;M1&quot;, name: &quot;DB 垂直切片&quot;, content: &quot;新建测试项目走数据库闭环；旧项目仍由旧模式运行，但不能同时写同一项目。&quot;, gate: &quot;闸门：Project/Chapter/Asset/Task 有事务与自动化测试。&quot; },
    { id: &quot;M2&quot;, name: &quot;只读审计导入器&quot;, content: &quot;扫描 JSON/Markdown、版本、task artifact 与素材；保留 ID，生成 MigrationReport。&quot;, gate: &quot;闸门：幂等导入、缺失引用和 legacy task 规则稳定。&quot; },
    { id: &quot;M3&quot;, name: &quot;影子导入&quot;, content: &quot;从真实备份反复导入临时 SQLite，做计数、外键、digest、文件与只读页面对照。&quot;, gate: &quot;闸门：重复演练结果一致，无未解释差异。&quot; },
    { id: &quot;M4&quot;, name: &quot;停写切换&quot;, content: &quot;冻结新写入与任务，备份，最终导入校验，切换 DB-only，在开放写入前冒烟。&quot;, gate: &quot;闸门：失败可完整恢复旧应用和切换前快照。&quot; },
    { id: &quot;M5/M6&quot;, name: &quot;观察与收缩&quot;, content: &quot;只读封存旧元数据，验证重启/任务/导出/删除，再移除旧业务文件读写。&quot;, gate: &quot;闸门：不允许 DB 查询失败时静默回退 JSON。&quot; }
  ];

  const finalDecisions = [
    &quot;DB-only 一次切换&quot;,
    &quot;本地 SQLite 单引擎&quot;,
    &quot;关系核心 + 版本 Json&quot;,
    &quot;凭据按调用运行时分治&quot;,
    &quot;SQLite 持久任务 + worker&quot;,
    &quot;旧 taskId + legacy stub&quot;
  ];

  const nextDecisions = [
    [&quot;下一阶段&quot;, &quot;现有七步链路缺口与验收文档&quot;]
  ];

  function renderSelectableGrid(grid, items, select, labelFor) {
    items.forEach((item) =&gt; {
      const button = document.createElement(&quot;button&quot;);
      button.type = &quot;button&quot;;
      button.className = &quot;btn viz-tile&quot;;
      button.dataset.item = item.id;
      button.setAttribute(&quot;role&quot;, &quot;listitem&quot;);
      button.setAttribute(&quot;aria-pressed&quot;, &quot;false&quot;);
      button.setAttribute(&quot;aria-label&quot;, labelFor(item));
      button.textContent = item.name;
      button.addEventListener(&quot;click&quot;, () =&gt; select(item.id));
      grid.appendChild(button);
    });
  }

  const currentGrid = root.querySelector(&quot;.d7-current-grid&quot;);
  const currentStatus = root.querySelector(&quot;.d7-current-status&quot;);
  const currentName = root.querySelector(&quot;.d7-current-name&quot;);
  const currentContent = root.querySelector(&quot;.d7-current-content&quot;);
  const currentRisk = root.querySelector(&quot;.d7-current-risk&quot;);

  function selectCurrent(id) {
    const item = currentSurfaces.find((entry) =&gt; entry.id === id) || currentSurfaces[0];
    currentGrid.querySelectorAll(&quot;button&quot;).forEach((button) =&gt; button.setAttribute(&quot;aria-pressed&quot;, String(button.dataset.item === item.id)));
    currentStatus.textContent = item.status;
    currentName.textContent = item.name;
    currentContent.textContent = item.content;
    currentRisk.textContent = `风险：${item.risk}`;
  }

  renderSelectableGrid(currentGrid, currentSurfaces, selectCurrent, (item) =&gt; `${item.name}：${item.status}`);
  selectCurrent(&quot;workspace&quot;);

  const targetGrid = root.querySelector(&quot;.d7-target-grid&quot;);
  const targetStatus = root.querySelector(&quot;.d7-target-status&quot;);
  const targetName = root.querySelector(&quot;.d7-target-name&quot;);
  const targetContent = root.querySelector(&quot;.d7-target-content&quot;);
  const targetRule = root.querySelector(&quot;.d7-target-rule&quot;);

  function selectTarget(id) {
    const item = targets.find((entry) =&gt; entry.id === id) || targets[0];
    targetGrid.querySelectorAll(&quot;button&quot;).forEach((button) =&gt; button.setAttribute(&quot;aria-pressed&quot;, String(button.dataset.item === item.id)));
    targetStatus.textContent = item.status;
    targetName.textContent = item.name;
    targetContent.textContent = item.content;
    targetRule.textContent = `规则：${item.rule}`;
  }

  renderSelectableGrid(targetGrid, targets, selectTarget, (item) =&gt; `${item.name}：${item.status}`);
  selectTarget(&quot;database&quot;);

  const stageGrid = root.querySelector(&quot;.d7-stage-grid&quot;);
  const stageId = root.querySelector(&quot;.d7-stage-id&quot;);
  const stageName = root.querySelector(&quot;.d7-stage-name&quot;);
  const stageContent = root.querySelector(&quot;.d7-stage-content&quot;);
  const stageGate = root.querySelector(&quot;.d7-stage-gate&quot;);

  function selectStage(id) {
    const item = stages.find((entry) =&gt; entry.id === id) || stages[0];
    stageGrid.querySelectorAll(&quot;button&quot;).forEach((button) =&gt; button.setAttribute(&quot;aria-pressed&quot;, String(button.dataset.item === item.id)));
    stageId.textContent = item.id;
    stageName.textContent = item.name;
    stageContent.textContent = item.content;
    stageGate.textContent = item.gate;
  }

  renderSelectableGrid(stageGrid, stages, selectStage, (item) =&gt; `${item.id}：${item.name}`);
  selectStage(&quot;M4&quot;);

  const choiceGrid = root.querySelector(&quot;.d7-choice-grid&quot;);
  finalDecisions.forEach((label) =&gt; {
    const item = document.createElement(&quot;span&quot;);
    item.className = &quot;viz-badge&quot;;
    item.setAttribute(&quot;role&quot;, &quot;listitem&quot;);
    item.textContent = label;
    choiceGrid.appendChild(item);
  });

  const nextGrid = root.querySelector(&quot;.d7-next-grid&quot;);
  nextDecisions.forEach(([id, label]) =&gt; {
    const item = document.createElement(&quot;span&quot;);
    item.className = &quot;viz-badge&quot;;
    item.setAttribute(&quot;role&quot;, &quot;listitem&quot;);
    item.textContent = `${id} · ${label}`;
    nextGrid.appendChild(item);
  });

  root.querySelectorAll(&quot;[data-view]&quot;).forEach((button) =&gt; {
    button.addEventListener(&quot;click&quot;, () =&gt; {
      const view = button.dataset.view;
      root.querySelectorAll(&quot;[data-view]&quot;).forEach((candidate) =&gt; candidate.setAttribute(&quot;aria-pressed&quot;, String(candidate === button)));
      root.querySelectorAll(&quot;[data-panel]&quot;).forEach((panel) =&gt; {
        panel.hidden = panel.dataset.panel !== view;
      });
    });
  });
})();
&lt;/script&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
